<main class="app">
  <app-nav-menu />

  <section class="expense-sheets">
    <h2>Expense sheets</h2>
    @if (error()) {
      <p class="status status--error">{{ error() }}</p>
    } @else {
      <ag-grid-angular
        style="height: 300px; width: 100%; cursor: pointer;"
        [rowData]="expenseSheets()"
        [columnDefs]="columnDefs"
        [theme]="gridTheme"
        (cellClicked)="onCellClicked($event)"
      />

      <h3>Add expense sheet</h3>
      <form class="add-expense-sheet-form" (ngSubmit)="addExpenseSheet()">
        <label>
          Sheet name
          <input type="text" name="sheetName" [(ngModel)]="newSheetName" required />
        </label>

        @if (createError()) {
          <p class="status status--error">{{ createError() }}</p>
        }

        <button type="submit">Add expense sheet</button>
      </form>
    }
  </section>
</main>
