<main class="auth">
  <h1>Financial Copilot</h1>
  <h2>Sign in</h2>

  <form class="auth-form" (ngSubmit)="submit()">
    <label>
      Username
      <input type="text" name="username" [(ngModel)]="username" required autocomplete="username" />
    </label>

    <label>
      Password
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="status status--error">{{ error() }}</p>
    }

    <button type="submit">Sign in</button>
  </form>

  <p class="auth-switch">No account yet? <a routerLink="/sign-up">Sign up</a></p>
</main>
